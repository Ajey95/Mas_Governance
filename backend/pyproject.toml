[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masguardeval"
version = "0.1.0"
description = "Risk-aware evaluation and observability framework for multi-agent LLM systems."
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
live = ["openai>=1.68"]
langchain = ["langchain>=1.0,<2"]
langgraph = ["langchain-core>=0.3.84,<2", "langgraph>=0.3.34,<2"]
autogen = ["autogen-core>=0.4,<1", "autogen-agentchat>=0.4,<1"]
crewai = ["crewai>=1.0,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
pgvector = ["psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1"]
langsmith = ["langsmith>=0.7,<1"]
all-integrations = [
  "langchain>=1.0,<2", "langgraph>=0.3.34,<2", "autogen-core>=0.4,<1", "autogen-agentchat>=0.4,<1",
  "crewai>=1.0,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1",
  "langsmith>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["masguardeval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
