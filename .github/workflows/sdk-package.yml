name: Python SDK and CLI

'on':
  push:
    paths:
      - 'backend/**'
      - 'examples/**'
      - '.github/workflows/sdk-package.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'examples/**'
      - '.github/workflows/sdk-package.yml'

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build pytest httpx
      - run: python -m build --sdist --wheel backend --outdir reports/sdk-dist
      - run: python -m pip install reports/sdk-dist/*.whl
      - run: python -m pip check
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements.txt --progress-spinner off
      - run: masguardeval --version
      - run: masguardeval validate --dataset examples/fictional_scenarios.json
      - run: masguardeval run-agent --dataset examples/fictional_scenarios.json --scenario fictional_tool_boundary --factory examples/cli_agent_factory.py:create_engine --out reports/ci-agent.json
      - run: masguardeval compare-agent --dataset examples/fictional_scenarios.json --scenario fictional_tool_boundary --factory examples/cli_agent_factory.py:create_engine --allow-unguarded --out reports/ci-comparison.json
      - run: masguardeval trace-report --input reports/ci-comparison.json --mode baseline --json-out reports/ci-baseline-detail.json
      - run: masguardeval diagnosis-analyze --help
      - run: python examples/custom_agent.py
      - run: python -m pytest backend/tests/test_cli_sdk.py -q

  native-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest httpx
      - run: python -m pip install -e 'backend[all-integrations]'
      - run: python -m pip check
      - run: python examples/langchain_agent.py
      - run: python examples/langgraph_agent.py
      - run: python examples/autogen_agent.py
      - run: python examples/crewai_agent.py
      - run: python -m pytest backend/tests -q
