[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masguardeval"
version = "0.1.0"
description = "Risk-aware evaluation and observability framework for multi-agent LLM systems."
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["masguardeval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
