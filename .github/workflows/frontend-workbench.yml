name: Local workbench build

'on':
  push:
    paths:
      - 'frontend/**'
      - 'website/**'
      - '.github/workflows/frontend-workbench.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'website/**'
      - '.github/workflows/frontend-workbench.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: node --check website/site.js
